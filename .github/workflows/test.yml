# Runs the tests on every push and pull request. Deploys are done by Cloudflare's GitHub integration
# (Workers Builds) using the deploy command `npm run deploy`.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
