name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build for the iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy the web app (plus pdf.js and mammoth) into the iOS project
        run: |
          node scripts/vendor.js
          npx cap sync ios

      - name: Build (unsigned, simulator)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package the simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --keepParent App.app "$GITHUB_WORKSPACE/OurMeals-simulator.zip"

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ourmeals-ios-simulator
          path: OurMeals-simulator.zip
          if-no-files-found: error

  publish:
    name: Publish to Latest build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Both app workflows update the same release, so take turns.
    concurrency:
      group: latest-build-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ourmeals-ios-simulator
      - uses: ./.github/actions/publish-latest
        with:
          file: OurMeals-simulator.zip
