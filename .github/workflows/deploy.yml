# Tests, then deploys to Cloudflare Workers on every push to main (or when run by hand from the Actions tab).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and optionally the
# repository variable GOOGLE_CLIENT_ID. See README → "Deploy to Cloudflare".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Find or create the D1 database
        run: |
          set -euo pipefail
          id=$(npx wrangler d1 list --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const db=JSON.parse(d).find(x=>x.name==='mealplanner');process.stdout.write(db?db.uuid:'')})")
          if [ -z "$id" ]; then
            npx wrangler d1 create mealplanner
            id=$(npx wrangler d1 list --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).find(x=>x.name==='mealplanner').uuid))")
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
          echo "Using D1 database $id"

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply mealplanner --remote

      - name: Deploy
        run: |
          args=()
          if [ -n "${{ vars.GOOGLE_CLIENT_ID }}" ]; then args+=(--var "GOOGLE_CLIENT_ID:${{ vars.GOOGLE_CLIENT_ID }}"); fi
          npx wrangler deploy "${args[@]}"
