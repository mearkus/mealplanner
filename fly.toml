# Fly.io config. Run `fly launch --copy-config --no-deploy`, then see README for volume + secrets.
app = "our-meals"
primary_region = "iad"

[build]

[env]
  DB_PATH = "/data/mealplanner.db"
  PORT = "8080"

[mounts]
  source = "meals_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
